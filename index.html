<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
--blue:#1a56db;
--blue2:#3b82f6;
--light:#f8fafc;
--border:#e2e8f0;
--text:#0f172a;
--muted:#64748b;
}

body{
font-family:'Plus Jakarta Sans',sans-serif;
background:var(--light);
color:var(--text);
}

/* CONTAINER */
.wrapper{
max-width:1100px;
margin:auto;
background:#fff;
min-height:100vh;
}

/* HEADER */
.header{
background:linear-gradient(135deg,#1e3a8a,#2563eb);
text-align:center;
padding:40px 20px;
color:#fff;
}

.live{
display:inline-flex;
align-items:center;
gap:6px;
background:rgba(255,255,255,0.15);
padding:6px 14px;
border-radius:20px;
font-size:12px;
margin-bottom:20px;
}

.dot{
width:8px;height:8px;border-radius:50%;
background:#22c55e;
animation:blink 1.2s infinite;
}

@keyframes blink{
50%{opacity:.3}
}

.logo{
width:90px;height:90px;
border-radius:50%;
overflow:hidden;
margin:auto;
border:3px solid rgba(255,255,255,0.3);
margin-bottom:12px;
}

.logo img{
width:100%;height:100%;object-fit:cover;
}

.title{
font-size:28px;
font-weight:800;
}

.subtitle{
font-size:13px;
opacity:.8;
margin-top:6px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:1.5fr 1fr;
gap:25px;
padding:30px;
}

@media(max-width:900px){
.grid{
grid-template-columns:1fr;
padding:20px;
}
}

/* SECTION */
.section{
margin-bottom:25px;
}

.label{
font-size:12px;
text-transform:uppercase;
color:var(--muted);
margin-bottom:12px;
font-weight:700;
}

/* OFFERS */
.offer{
display:flex;
align-items:center;
gap:12px;
padding:14px;
border:1px solid var(--border);
border-radius:12px;
margin-bottom:10px;
background:#f1f5f9;
transition:.2s;
}

.offer:hover{
background:#fff;
transform:translateY(-2px);
}

.icon{
font-size:22px;
}

.offer strong{
font-size:18px;
display:block;
}

/* STATS */
.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.stat{
padding:15px;
text-align:center;
border:1px solid var(--border);
border-radius:12px;
background:#f1f5f9;
}

.stat b{
display:block;
font-size:18px;
color:var(--blue);
}

/* FEATURES */
.features{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.feature{
padding:15px;
text-align:center;
border:1px solid var(--border);
border-radius:12px;
background:#f1f5f9;
}

/* CTA */
.cta{
text-align:center;
padding:35px 20px;
border-top:1px solid var(--border);
}

.btn{
display:inline-block;
background:linear-gradient(135deg,#1e3a8a,#1a56db);
color:#fff;
padding:16px 25px;
border-radius:12px;
font-weight:700;
text-decoration:none;
transition:.3s;
width:100%;
max-width:350px;
}

.btn:hover{
transform:translateY(-2px);
}

.trust{
margin-top:15px;
font-size:12px;
color:var(--muted);
}

/* MOBILE FIXES */
@media(max-width:500px){
.title{font-size:22px}
.offer strong{font-size:16px}
}
</style>
